<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Shopee Calc">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Smart Can — Calculadora Shopee</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1a1a1a;min-height:100vh;padding:1rem}
h1{font-size:18px;font-weight:700;color:#ff6b35;margin-bottom:1.25rem;display:flex;align-items:center;gap:8px}
h1 span{font-size:13px;color:#999;font-weight:400}
.card{background:#fff;border:1px solid #e8e8e8;border-radius:14px;padding:1.25rem;margin-bottom:1rem}
label{font-size:12px;color:#999;display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px}
.input-row{display:flex;align-items:center;gap:8px}
.prefix{font-size:16px;color:#bbb;font-weight:600}
input[type=number]{flex:1;font-size:20px;font-weight:600;background:transparent;border:none;color:#1a1a1a;outline:none;width:100%}
input[type=number]::placeholder{color:#ddd}
input[type=range]{width:100%;margin:10px 0 4px;accent-color:#ff6b35;height:4px}
.range-labels{display:flex;justify-content:space-between;font-size:11px;color:#bbb}
.margin-val{font-size:28px;font-weight:700;color:#ff6b35;text-align:center;margin:6px 0}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:#f9f9f9;border-radius:10px;padding:1rem;text-align:center;border:1px solid #f0f0f0}
.metric-label{font-size:11px;color:#aaa;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.4px}
.metric-val{font-size:20px;font-weight:700}
.metric-val.price{color:#ff6b35}
.metric-val.profit{color:#16a34a}
.breakdown{margin-top:1rem;padding-top:1rem;border-top:1px solid #f0f0f0}
.row{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:#aaa}
.row.total{font-weight:700;color:#1a1a1a;font-size:15px;padding-top:8px;border-top:1px solid #e8e8e8;margin-top:4px}
.badge{display:inline-block;font-size:11px;padding:3px 10px;border-radius:20px;background:#fff3ee;color:#ff6b35;margin-bottom:12px;border:1px solid #ffd5c2}
.warning{font-size:12px;color:#d97706;margin-top:10px;text-align:center;padding:8px;background:#fffbeb;border-radius:8px;border:1px solid #fde68a}
.hidden{display:none}
.divider{height:1px;background:#f0f0f0;margin:1rem 0}
</style>
</head>
<body>

<h1>SC <span>Calculadora Shopee</span></h1>

<div class="card">
  <label>Valor de custo</label>
  <div class="input-row">
    <span class="prefix">R$</span>
    <input type="number" id="cost" inputmode="decimal" placeholder="0,00" oninput="calc()">
  </div>
  <div class="divider"></div>
  <label>Frete (não reembolsado pelo Shopee)</label>
  <div class="input-row">
    <span class="prefix">R$</span>
    <input type="number" id="frete" inputmode="decimal" placeholder="0,00" oninput="calc()">
  </div>
</div>

<div class="card">
  <label>Margem de lucro sobre o custo</label>
  <div class="margin-val" id="margin-display">55%</div>
  <input type="range" id="margin" min="30" max="80" value="55" step="1" oninput="updateMargin();calc()">
  <div class="range-labels"><span>30%</span><span>55%</span><span>80%</span></div>
</div>

<div class="card hidden" id="result-card">
  <div id="bracket-badge" class="badge"></div>
  <div class="result-grid">
    <div class="metric">
      <div class="metric-label">Preço recomendado</div>
      <div class="metric-val price" id="rec-price">—</div>
    </div>
    <div class="metric">
      <div class="metric-label">Lucro líquido</div>
      <div class="metric-val profit" id="profit-val">—</div>
    </div>
    <div class="metric">
      <div class="metric-label">Lucro % custo</div>
      <div class="metric-val profit" id="profit-pct">—</div>
    </div>
    <div class="metric">
      <div class="metric-label">Taxa Shopee</div>
      <div class="metric-val" id="fee-val">—</div>
    </div>
  </div>
  <div class="breakdown">
    <div class="row"><span>Preço de venda</span><span id="b-price">—</span></div>
    <div class="row"><span>Taxa Shopee</span><span id="b-fee">—</span></div>
    <div class="row"><span>Impostos (10%)</span><span id="b-tax">—</span></div>
    <div class="row"><span>Frete</span><span id="b-frete">—</span></div>
    <div class="row"><span>Custo</span><span id="b-cost">—</span></div>
    <div class="row total"><span>Lucro líquido</span><span id="b-profit">—</span></div>
  </div>
  <div class="warning hidden" id="cliff-warn">
    ⚠ Próximo de uma faixa de transição — considere ajustar o preço
  </div>
</div>

<script>
function brl(v){return'R$'+v.toFixed(2).replace('.',',')}
function updateMargin(){document.getElementById('margin-display').textContent=document.getElementById('margin').value+'%';}
function shopeeCalc(cost,frete,multiplier){
  const target=multiplier*cost+frete;
  const brackets=[
    {max:8,fixed:0,rate:0.5,div:0.4,label:'Faixa <R$8'},
    {max:80,fixed:4,rate:0.2,div:0.7,label:'Faixa R$8–R$79,99'},
    {max:100,fixed:16,rate:0.14,div:0.76,label:'Faixa R$80–R$99,99'},
    {max:200,fixed:20,rate:0.14,div:0.76,label:'Faixa R$100–R$199,99'},
    {max:500,fixed:26,rate:0.14,div:0.76,label:'Faixa R$200–R$499,99'},
    {max:Infinity,fixed:28,rate:0.14,div:0.76,label:'Faixa R$500+'}
  ];
  for(const b of brackets){
    const p=(target+b.fixed)/b.div;
    if(p<b.max) return{price:p,fee:b.rate*p+b.fixed,tax:p*0.1,label:b.label};
  }
}
function calc(){
  const cost=parseFloat(document.getElementById('cost').value)||0;
  const frete=parseFloat(document.getElementById('frete').value)||0;
  const marginPct=parseInt(document.getElementById('margin').value);
  const rc=document.getElementById('result-card');
  if(cost<=0){rc.classList.add('hidden');return;}
  const r=shopeeCalc(cost,frete,1+marginPct/100);
  const profit=r.price-r.fee-r.tax-frete-cost;
  rc.classList.remove('hidden');
  document.getElementById('bracket-badge').textContent=r.label;
  document.getElementById('rec-price').textContent=brl(r.price);
  document.getElementById('profit-val').textContent=brl(profit);
  document.getElementById('profit-pct').textContent=(profit/cost*100).toFixed(1)+'%';
  document.getElementById('fee-val').textContent=brl(r.fee);
  document.getElementById('b-price').textContent=brl(r.price);
  document.getElementById('b-fee').textContent='–'+brl(r.fee);
  document.getElementById('b-tax').textContent='–'+brl(r.tax);
  document.getElementById('b-frete').textContent='–'+brl(frete);
  document.getElementById('b-cost').textContent='–'+brl(cost);
  document.getElementById('b-profit').textContent=brl(profit);
  const near=[8,80,100,200,500].some(c=>r.price>c*0.97&&r.price<c*1.03);
  const w=document.getElementById('cliff-warn');
  near?w.classList.remove('hidden'):w.classList.add('hidden');
}
</script>
</body>
</html>
